name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # Frontend linting and type checking
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run ESLint
        run: npm run lint
        working-directory: .

      - name: Run TypeScript type check
        run: npm run typecheck
        working-directory: .

      - name: Run tests
        run: npm run test -- --coverage=false
        working-directory: .

      - name: Build Next.js app
        run: npm run build
        working-directory: .
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  # Functions linting and type checking
  functions-lint:
    name: Functions Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Run ESLint
        run: npm run lint
        working-directory: ./functions

      - name: Run TypeScript type check
        run: npm run typecheck
        working-directory: ./functions

      - name: Run tests
        run: npm run test -- --coverage=false
        working-directory: ./functions

      - name: Build Functions
        run: npm run build
        working-directory: ./functions

  # Security rules testing
  security-rules-test:
    name: Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      # The Firestore and Storage emulators are JVM-based. ubuntu-latest
      # runners have JDKs on disk but nothing on PATH without this step,
      # so emulators:exec would otherwise fail before any test runs.
      - name: Setup Java (required by Firestore/Storage emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.29.0

      # Uses a fake "demo-" project id so this never depends on real Firebase
      # credentials/secrets being configured in the repo - emulators run
      # fully locally regardless. Previously this step set
      # FIRESTORE_EMULATOR_HOST without ever starting an emulator, so every
      # test hit a connection refused error.
      - name: Run security rules tests against Firebase emulators
        run: firebase emulators:exec --only firestore,auth,storage --project demo-mitra "npm run test -- --testPathPattern=\"security\" --coverage=false"
        working-directory: .

  # Unit and integration tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./functions

      # The Firestore and Storage emulators are JVM-based. ubuntu-latest
      # runners have JDKs on disk but nothing on PATH without this step,
      # so emulators:exec would otherwise fail before any test runs.
      - name: Setup Java (required by Firestore/Storage emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.29.0

      # firebase/firebase-tools@latest is not a real GitHub Action (no
      # action.yml) - the "Start Firebase Emulators" step this replaced
      # always failed at job setup before checkout even ran. `test:unit`/
      # `test:integration` also never existed as npm scripts (only `test`
      # does). The functions test suite exercises Firestore/Auth/Storage
      # directly via the Admin SDK against the emulators below - it does
      # not need the emulators:start `functions` target, which would
      # require a build step first.
      - name: Run functions tests against Firebase emulators
        run: firebase emulators:exec --only auth,firestore,storage --project demo-mitra "npm --prefix functions run test -- --coverage=false"
        working-directory: .

  # Deploy backend (Cloud Functions) to staging.
  #
  # Phase 19A: this job previously also ran FirebaseExtended/action-hosting-
  # deploy@v0 to deploy the Next.js frontend to Firebase Hosting. That could
  # never have worked: firebase.json has no `hosting` block at all (no
  # `public` dir, no Next.js framework config), and this app has no
  # `output: "export"`/`"standalone"` — it's a standard server-rendered
  # Next.js build, not something a bare Firebase Hosting deploy can serve.
  # vercel.json (present, correct, Next.js-framework-aware) is this
  # repository's actual frontend deployment config; Vercel deploys the
  # frontend itself via its own Git integration on push, independent of
  # this workflow. This job is scoped to what Firebase actually serves:
  # the backend (Cloud Functions).
  deploy-backend-staging:
    name: Deploy Backend to Staging
    needs: [frontend-lint, functions-lint, test, security-rules-test]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./functions

      - name: Build functions
        run: npm run build
        working-directory: ./functions

      - name: Deploy Functions to Staging
        run: |
          firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        working-directory: ./functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Deploy backend (Cloud Functions) to production. See the comment on
  # deploy-backend-staging above — the frontend is deployed by Vercel, not
  # this workflow.
  deploy-backend-production:
    name: Deploy Backend to Production
    needs: [frontend-lint, functions-lint, test, security-rules-test]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./functions

      - name: Build functions
        run: npm run build
        working-directory: ./functions

      - name: Deploy Functions to Production
        run: |
          firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        working-directory: ./functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify deployment
        run: |
          echo "Deployment to production completed successfully"