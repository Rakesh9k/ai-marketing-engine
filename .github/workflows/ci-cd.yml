name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # Frontend linting and type checking
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine

      - name: Run ESLint
        run: npm run lint
        working-directory: ./ai-marketing-engine

      - name: Run TypeScript type check
        run: npm run typecheck
        working-directory: ./ai-marketing-engine

      - name: Run tests
        run: npm run test -- --coverage=false
        working-directory: ./ai-marketing-engine

      - name: Build Next.js app
        run: npm run build
        working-directory: ./ai-marketing-engine
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  # Functions linting and type checking
  functions-lint:
    name: Functions Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine/functions

      - name: Run ESLint
        run: npm run lint
        working-directory: ./ai-marketing-engine/functions

      - name: Run TypeScript type check
        run: npm run typecheck
        working-directory: ./ai-marketing-engine/functions

      - name: Run tests
        run: npm run test -- --coverage=false
        working-directory: ./ai-marketing-engine/functions

      - name: Build Functions
        run: npm run build
        working-directory: ./ai-marketing-engine/functions

  # Security rules testing
  security-rules-test:
    name: Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine

      - name: Run security rules tests
        run: npm run test -- --testPathPattern="security"
        working-directory: ./ai-marketing-engine
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

  # Unit and integration tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine/functions

      - name: Start Firebase Emulators
        uses: firebase/firebase-tools@latest
        with:
          args: emulators:start --only auth,firestore,storage,functions
          project: ${{ env.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Wait for emulators
        run: sleep 30

      - name: Run unit tests
        run: npm run test:unit -- --coverage=false
        working-directory: ./ai-marketing-engine

      - name: Run integration tests
        run: npm run test:integration -- --coverage=false
        working-directory: ./ai-marketing-engine
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199
          FIREBASE_FUNCTIONS_EMULATOR_HOST: localhost:5001

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    needs: [frontend-lint, functions-lint, test]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine/functions

      - name: Build frontend
        run: npm run build
        working-directory: ./ai-marketing-engine

      - name: Build functions
        run: npm run build
        working-directory: ./ai-marketing-engine/functions

      - name: Deploy to Firebase Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
          channelId: staging

      - name: Deploy Functions to Staging
        run: |
          firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        working-directory: ./ai-marketing-engine/functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    needs: [frontend-lint, functions-lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./ai-marketing-engine/functions

      - name: Build frontend
        run: npm run build
        working-directory: ./ai-marketing-engine

      - name: Build functions
        run: npm run build
        working-directory: ./ai-marketing-engine/functions

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}

      - name: Deploy Functions to Production
        run: |
          firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        working-directory: ./ai-marketing-engine/functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify deployment
        run: |
          echo "Deployment to production completed successfully"